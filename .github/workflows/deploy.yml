# 교재를 테스트·빌드해 GitHub Pages 에 배포한다.
# 시각 테스트(tests/visual)는 기준 이미지가 Windows 전용이라 여기서 돌리지 않는다.
name: deploy
on:
  push:
    branches: [claude/gifted-goldberg-u1f9c6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04 # 레이블이 몰래 바뀌지 않게 고정 (external-facts.md 4장)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: textbook/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - run: npm ci
        working-directory: textbook
      - run: npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium
      - run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: npm test
        working-directory: textbook
      - run: npm run check -- --allow-missing
        working-directory: textbook
      - run: npm run test:e2e
        working-directory: textbook
      - run: npm run build:site
        working-directory: textbook
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-26.04 # 레이블이 몰래 바뀌지 않게 고정 (external-facts.md 4장)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
