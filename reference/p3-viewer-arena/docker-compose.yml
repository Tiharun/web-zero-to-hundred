# 서버 + PostgreSQL을 한 번에 띄워요.
#   docker compose up --build -d     → http://localhost:8080
#   docker compose logs -f server    → 서버 로그 보기
#   docker compose down              → 끄기(데이터는 남아요)
#   docker compose down -v           → 끄고 DB 데이터(볼륨)까지 지우기
#   docker compose up -d db          → DB만 띄우고 서버는 cargo run으로(개발할 때)

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena # 연습용 비밀번호. 인터넷에 여는 서버에서는 바꿔요.
      POSTGRES_DB: viewer_arena
    volumes:
      # PostgreSQL 18부터 데이터 위치가 바뀌었어요: /var/lib/postgresql/data 가 아니라 /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    ports:
      # cargo run으로 띄운 서버와 psql이 붙을 수 있게 이 PC(127.0.0.1)에만 열어요.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d viewer_arena"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    environment:
      # 컨테이너끼리는 서비스 이름(db)으로 찾아가요.
      DATABASE_URL: postgres://arena:arena@db:5432/viewer_arena
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy # DB가 준비된 뒤에 서버를 켜요

volumes:
  pgdata:
