<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 두 손가락 확대를 막아서 조이스틱을 쓸 때 화면이 움직이지 않게 해요 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Viewer Arena · 참가</title>
  </head>
  <body class="page-play">
    <main>
      <header class="play-header">
        <span id="room-label"></span>
        <span id="phase"></span>
        <span id="score"></span>
      </header>

      <form id="join-form" class="card">
        <label for="name">닉네임 (1~12자)</label>
        <input id="name" maxlength="12" autocomplete="nickname" required />
        <button id="join" type="submit">참가하기</button>
      </form>

      <section id="game" hidden>
        <canvas id="arena" aria-label="아레나(내 플레이어는 흰 테두리)"></canvas>
        <div id="stick" class="stick" aria-label="조이스틱"><div id="knob" class="knob"></div></div>
        <p class="small">조이스틱을 끌거나 키보드 WASD·방향키로 움직여요</p>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
