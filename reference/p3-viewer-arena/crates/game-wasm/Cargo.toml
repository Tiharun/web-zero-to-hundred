# game-wasm: game-core의 이동 예측을 브라우저에 내보내는 얇은 포장.
# 빌드: cargo build -p game-wasm --target wasm32-unknown-unknown --release
#       wasm-bindgen --target web --out-dir client/src/wasm target/wasm32-unknown-unknown/release/game_wasm.wasm
[package]
name = "game-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib = .wasm 파일을 만드는 형식, rlib = cargo test가 이 크레이트를 링크할 수 있게 한다.
crate-type = ["cdylib", "rlib"]

[dependencies]
game-core = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
